name: Release (stories, rebuild and held changes go live together)
# ONE CLOCK. Stories go live, the site rebuilds and held changes ship at the same moments: the slots in scripts/slots.mjs
# (7, 11, 15 and 19 hrs IST). Work in progress waits on the `next` branch until the next slot. For an emergency, press
# "Run workflow" with force = true, or push straight to this branch (Railway deploys any push at once).
#
# The cron lines below are only a backup: GitHub runs scheduled workflows hours late. The reliable start is an outside
# timer calling this workflow at each slot (see RELEASE-SCHEDULE.md).
on:
  schedule:
    - cron: '32 1 * * *'    # 07:02 IST
    - cron: '32 5 * * *'    # 11:02 IST
    - cron: '32 9 * * *'    # 15:02 IST
    - cron: '32 13 * * *'   # 19:02 IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Release now even if no slot has passed (emergency)'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: rebuild
  cancel-in-progress: false
env:
  LIVE_BRANCH: claude/beautiful-newton-lnqky5   # the branch Railway deploys
  HOLD_BRANCH: next                              # work waiting for the next slot
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.LIVE_BRANCH }}', fetch-depth: 0 }
      - name: Is a release due?
        id: check
        run: |
          node scripts/rebuild-if-due.mjs | tee /tmp/due.txt
          if [ "${{ github.event.inputs.force }}" = "true" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; else grep '^due=' /tmp/due.txt >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.due == 'true'
        with: { node-version: 22, cache: npm }
      - name: Bring in the held changes
        if: steps.check.outputs.due == 'true'
        run: |
          git config user.name "aividhyarthi"
          git config user.email "226963610+aividhyarthi@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$HOLD_BRANCH" >/dev/null; then
            git fetch origin "$HOLD_BRANCH"
            git merge --no-edit "origin/$HOLD_BRANCH"
          else
            echo "No $HOLD_BRANCH branch: nothing was held."
          fi
      - name: Build and check before going live
        if: steps.check.outputs.due == 'true'
        run: |
          npm ci
          export SW_NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx astro build
          node scripts/check-release.mjs
      - name: Go live
        if: steps.check.outputs.due == 'true'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > src/data/build-stamp.txt
          git add src/data/build-stamp.txt
          git commit -m "Release: slot reached, held changes and due stories go live"
          git push origin "HEAD:$LIVE_BRANCH"
