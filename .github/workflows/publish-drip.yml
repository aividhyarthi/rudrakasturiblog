name: Drip-release reviewed drafts
# Every 30 minutes from 7:45am to 11:15am IST (02:15-05:45 UTC), release the next reviewed draft in
# scripts/release-next-draft.mjs's queue, one at a time: 8 releases a day. The queue is ordered by time
# sensitivity (today's Kartika festival guides first, then the evergreen temple/scripture stories), so with
# 24 drafts queued this naturally spreads them 8 today, 8 tomorrow, 8 the day after. Does nothing once the
# queue is empty.
#
# The 8 one-off entries pinned to 20 Nov (1:00pm-4:30pm IST / 07:30-11:00 UTC) cover today only: the
# 7:45-11:15am window was already missed the day this went live, so today's batch runs in the afternoon
# instead. They harmlessly do nothing on any other 20 November.
on:
  schedule:
    - cron: '15,45 2-5 * * *'
    - cron: '30 7 20 11 *'
    - cron: '0 8 20 11 *'
    - cron: '30 8 20 11 *'
    - cron: '0 9 20 11 *'
    - cron: '30 9 20 11 *'
    - cron: '0 10 20 11 *'
    - cron: '30 10 20 11 *'
    - cron: '0 11 20 11 *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish-drip
  cancel-in-progress: false
env:
  LIVE_BRANCH: claude/beautiful-newton-lnqky5
jobs:
  release-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.LIVE_BRANCH }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Release the next due draft
        run: node scripts/release-next-draft.mjs
      - name: Commit and push if something was released
        run: |
          git config user.name "Southwala Editor"
          git config user.email "editor@southwala.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Drip-release: next reviewed draft goes live" && git push origin "HEAD:$LIVE_BRANCH")
