name: Drip-release reviewed drafts
# Every 30 minutes from 7:45am to 3:15pm IST (02:15-09:45 UTC), release the next reviewed draft in
# scripts/release-next-draft.mjs's queue, one at a time, so a batch of articles goes live through the
# morning instead of all at once. Does nothing once the queue is empty.
on:
  schedule:
    - cron: '15,45 2-9 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish-drip
  cancel-in-progress: false
env:
  LIVE_BRANCH: claude/beautiful-newton-lnqky5
jobs:
  release-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.LIVE_BRANCH }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Release the next due draft
        run: node scripts/release-next-draft.mjs
      - name: Commit and push if something was released
        run: |
          git config user.name "Southwala Editor"
          git config user.email "editor@southwala.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Drip-release: next reviewed draft goes live" && git push origin "HEAD:$LIVE_BRANCH")
