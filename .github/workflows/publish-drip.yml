name: Drip-release reviewed drafts
# Checks every 2 hours, all day. scripts/release-next-draft.mjs releases however many due drafts are
# needed to reach today's quota (DAILY_LIMIT) in whichever run actually does it, so this loses nothing
# even though GitHub won't reliably grant all 12 of these daily firings - whichever one goes first each
# day brings the count up to quota. Note this means releases usually land in one burst on the first firing
# of the day rather than evenly spread across it; total daily delivery is guaranteed, exact pacing isn't.
#
# The commit/push step also retries against pushes from the site's other automated bots (newsroom,
# editorial QA, the daily release workflow) landing on the same branch: it rebases onto the latest remote
# commit and retries a few times instead of failing outright on a race.
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish-drip
  cancel-in-progress: false
env:
  LIVE_BRANCH: claude/beautiful-newton-lnqky5
jobs:
  release-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.LIVE_BRANCH }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Release the next due draft
        run: node scripts/release-next-draft.mjs
      - name: Commit and push if something was released (retrying past races with other bots)
        run: |
          git config user.name "Southwala Editor"
          git config user.email "editor@southwala.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Drip-release: next reviewed draft goes live"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$LIVE_BRANCH"; then exit 0; fi
            echo "Push rejected (attempt $i/5), rebasing onto latest $LIVE_BRANCH and retrying..."
            git fetch origin "$LIVE_BRANCH"
            git rebase "origin/$LIVE_BRANCH"
            sleep $((i * 5))
          done
          echo "::error::Could not push after 5 attempts; this draft's flip was not published. It stays draft:true upstream, so the next scheduled run will simply try it again."
          exit 1
